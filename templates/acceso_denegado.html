{% extends 'base.html' %}

{% block titulo %}Acceso denegado{% endblock %}

{% block contenido %}
<div class="row">
    <div class="col-md-7 mx-auto">
        <div class="card-modern text-center">
            <div class="card-body py-5">
                <i class="bi bi-shield-lock display-3" style="color: var(--verde-profundo);"></i>
                <h2 class="fw-bold mt-3" style="color: var(--verde-profundo);">Acceso restringido</h2>
                <p class="text-muted">Debes iniciar sesión o tener permisos suficientes para ingresar a esta sección.</p>
                <div class="d-flex gap-2 justify-content-center flex-wrap">
                    <a href="/login/" class="btn btn-success-custom"><i class="bi bi-key"></i> Iniciar sesión</a>
                    <a href="/" class="btn btn-outline-custom"><i class="bi bi-house"></i> Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
